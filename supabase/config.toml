# supabase/config.toml
# ─────────────────────────────────────────────────────────────
# Local Supabase development configuration.
# Run `npx supabase start` to spin up the local stack.
# Run `npx supabase db reset` to re-apply all migrations + seed.
# ─────────────────────────────────────────────────────────────

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your site. Used for constructing redirect URLs.
site_url = "http://127.0.0.1:3000"
# A list of additional redirect URLs that are allowed (glob patterns).
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
# JWT secret. Automatically generated locally.
jwt_expiry = 3600
# Disable email confirmation in local dev — we use synthetic emails
# that aren't deliverable anyway, and we set email_confirm=true
# in the Admin API when creating users.
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# Disable all OAuth providers by default.
# Enable them individually in the Supabase Dashboard for production.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false
